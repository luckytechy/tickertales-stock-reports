name: Nightly StockSense

# Every night, off-peak: refresh any report whose company announced results
# 3+ days ago, then add the next companies from queue/nifty100.json.
# How many per night: repo variable STOCKS_PER_NIGHT (default 3).

on:
  schedule:
    - cron: "41 19 * * *"   # 01:11 IST every night
  workflow_dispatch:
    inputs:
      max:
        description: "How many stocks to build this run (blank = STOCKS_PER_NIGHT or 3)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: generate-report
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node (for Claude Code)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pick tonight's stocks
        env:
          MAX: ${{ inputs.max || vars.STOCKS_PER_NIGHT || '3' }}
        run: |
          python scripts/plan_nightly.py --max "$MAX" > plan.txt
          echo "Tonight:"; cat plan.txt
          echo "### Tonight" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' plan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Build and publish each
        id: build
        env:
          MAX_REPORT_USD: ${{ vars.MAX_REPORT_USD || '1.00' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          built=0
          while read -r T PEER WHY <&3; do
            [ -z "$T" ] && continue
            [ "$PEER" = "-" ] && PEER=""
            echo "::group::$T ($WHY)"
            set +e
            bash scripts/run_report.sh "$T" "$PEER"; rc=$?
            set -e
            if [ $rc -eq 0 ] && bash scripts/publish.sh "Report: $T - $WHY ($(date -u +%Y-%m-%d))"; then
              built=1
              echo "- $T published ($WHY)" >> "$GITHUB_STEP_SUMMARY"
            elif [ $rc -eq 3 ]; then
              bash scripts/defer.sh "$T" || true
              echo "- $T hit the \$${MAX_REPORT_USD} cap - set aside, retried in 7 days" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$T failed tonight - it will be picked up again tomorrow."
              echo "- $T FAILED ($WHY)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::endgroup::"
          done 3< plan.txt
          echo "built=$built" >> "$GITHUB_OUTPUT"

      - name: Show them on tickertales.in
        if: steps.build.outputs.built == '1'
        run: bash scripts/notify_site.sh
