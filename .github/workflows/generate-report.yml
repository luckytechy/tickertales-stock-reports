name: Generate Stock Report

# Build one StockSense report on demand. The nightly run does this
# automatically; use this to add or refresh a specific stock right now.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "NSE symbol (e.g. ITC, TATACOMM, COALINDIA)"
        required: true
        type: string
      peer:
        description: "Optional peer to compare against (blank = the one in queue/nifty100.json)"
        required: false
        type: string
      max_usd:
        description: "Spending cap for this report in USD (blank = MAX_REPORT_USD or 1.00)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: generate-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node (for Claude Code)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build report
        env:
          MAX_REPORT_USD: ${{ inputs.max_usd || vars.MAX_REPORT_USD || '1.00' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TICKER: ${{ inputs.ticker }}
          PEER: ${{ inputs.peer }}
        run: |
          if [ -z "$PEER" ]; then
            PEER=$(python -c "import json,sys; t=sys.argv[1].upper().strip(); print(next((c.get('peer','') for c in json.load(open('queue/nifty100.json'))['companies'] if c['ticker']==t), ''))" "$TICKER")
          fi
          bash scripts/run_report.sh "$TICKER" "$PEER"

      - name: Publish
        env:
          TICKER: ${{ inputs.ticker }}
        run: |
          bash scripts/publish.sh "Report: $TICKER ($(date -u +%Y-%m-%d))"

      - name: Show it on tickertales.in
        run: bash scripts/notify_site.sh
